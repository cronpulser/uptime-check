name: Uptime check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CronPulser endpoints
        run: |
          # A URL fails only after 3 failed tries 30 s apart, so a short
          # restart (the mail server needs about a minute after a reboot)
          # does not send an alert.
          urls="https://api.cronpulser.com/health https://app.cronpulser.com/ https://cronpulser.com/ https://cronpulser.com/uptime-test-404"
          failed=0
          for url in $urls; do
            ok=0
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "$url try $try: HTTP $code"
              [ "$try" -lt 3 ] && sleep 30
            done
            if [ "$ok" = 1 ]; then
              echo "OK   $url"
            else
              echo "::error::DOWN $url (last HTTP $code)"
              failed=1
            fi
          done
          if [ "$failed" = 1 ]; then
            echo "Health details:"
            curl -s --max-time 15 https://api.cronpulser.com/health || true
            exit 1
          fi
